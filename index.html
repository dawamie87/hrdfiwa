        let dataKaryawan = [], dataInfo = [], dataEbooks = [], dataAgenda = [];
        let loadingState = { karyawan: false, info: false, ebook: false, agenda: false };
        let isOfflineMode = false;
        let isDarkMode = false;
        let viewModeDirektur = 'list';
        
        const ebookColors = ["bg-emerald-100 text-emerald-600", "bg-blue-100 text-blue-600", "bg-purple-100 text-purple-600", "bg-orange-100 text-orange-600", "bg-pink-100 text-pink-600", "bg-indigo-100 text-indigo-600"];
        
        let currentPage = 'beranda';
        let currentDirectorTab = 'ikhwan';
        let searchKeyword = '', sortOrder = 'name_asc', filterDept = '', filterDiv = '';
        let genderChartInstance = null, divisionChartInstance = null, eduChartInstance = null;

        // --- HELPER FUNCTIONS ---
        function getProp(obj, keys) {
            if (!obj) return null;
            if (!Array.isArray(keys)) keys = [keys];
            for (let key of keys) {
                if (obj[key] !== undefined) return obj[key];
                let lowerKey = key.toLowerCase();
                for (let k in obj) {
                    let kNorm = k.toLowerCase().replace(/_/g, '').replace(/[^\w]/g, '');
                    let keyNorm = lowerKey.replace(/_/g, '').replace(/[^\w]/g, '');
                    if (kNorm === keyNorm) return obj[k];
                }
            }
            return null;
        }

        // DATE PARSER
        function parseDate(dateInput) {
            if (!dateInput) return null;
            if (dateInput instanceof Date) return dateInput;
            const str = String(dateInput).trim();
            let d = new Date(str);
            if (!isNaN(d.getTime())) return d;
            const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (dmy) return new Date(dmy[3], parseInt(dmy[2]) - 1, dmy[1]);
            const indoMonths = ["januari", "februari", "maret", "april", "mei", "juni", "juli", "agustus", "september", "oktober", "november", "desember"];
            const shortIndoMonths = ["jan", "feb", "mar", "apr", "mei", "jun", "jul", "agu", "sep", "okt", "nov", "des"];
            const textMatch = str.match(/^(\d{1,2})[\s\-\/]+([a-zA-Z]+)[\s\-\/]+(\d{4})$/);
            if (textMatch) {
                const day = parseInt(textMatch[1]);
                const monthStr = textMatch[2].toLowerCase();
                const year = parseInt(textMatch[3]);
                let monthIndex = indoMonths.indexOf(monthStr);
                if (monthIndex === -1) monthIndex = shortIndoMonths.indexOf(monthStr);
                if (monthIndex !== -1) return new Date(year, monthIndex, day);
            }
            return null;
        }

        function formatDateIndo(dateString) {
            const date = parseDate(dateString);
            if (!date || isNaN(date.getTime())) return "-";
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatDateLongIndo(dateString) {
            const date = parseDate(dateString);
            if (!date || isNaN(date.getTime())) return "-";
            const day = date.getDate();
            const indoMonths = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const month = indoMonths[date.getMonth()];
            const year = date.getFullYear();
            return `${day} ${month} ${year}`;
        }
        
        function hitungMasaKerja(dateString) {
            const startDate = parseDate(dateString);
            if (!startDate || isNaN(startDate.getTime())) return "";
            const now = new Date();
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }
            let result = [];
            if (years > 0) result.push(`${years} Thn`);
            if (months > 0) result.push(`${months} Bln`);
            return result.length === 0 ? "Baru Bergabung" : result.join(" ");
        }

        function normalizeGender(g) {
            if (!g) return 'unknown';
            g = String(g).toLowerCase().trim();
            if (['ikhwan', 'laki-laki', 'laki', 'l', 'pria', 'male', 'putra'].includes(g)) return 'ikhwan';
            if (['akhwat', 'perempuan', 'wanita', 'p', 'female', 'putri'].includes(g)) return 'akhwat';
            return 'unknown';
        }

        function getDirectDriveUrl(url) {
            if (!url) return 'https://api.dicebear.com/7.x/avataaars/svg?seed=fallback';
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                const idRegex = /[-\w]{25,}/;
                const match = url.match(idRegex);
                if (match) return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w400`;
            }
            return url;
        }

        // --- PRAYER TIMES LOGIC (UPDATED) ---
        async function fetchPrayerTimes() {
            const date = new Date();
            const dateStr = `${date.getDate()}-${date.getMonth() + 1}-${date.getFullYear()}`;
            // Koordinat Desa Karihkil, Kec. Ciseeng, Kab. Bogor
            const lat = -6.4921461;
            const long = 106.6802685;
            
            try {
                // Method 20 = Kemenag RI
                const response = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${long}&method=20`);
                const data = await response.json();
                if(data.code === 200) {
                    updatePrayerWidget(data.data.timings, data.data.date.hijri);
                }
            } catch (e) {
                console.error("Gagal memuat jadwal shalat", e);
            }
        }

        function updatePrayerWidget(timings, hijri) {
            const container = document.getElementById('prayer-times-list');
            if(!container) return; // Check if element exists before updating
            
            const prayers = [
                { name: 'Subuh', time: timings.Fajr },
                { name: 'Dzuhur', time: timings.Dhuhr },
                { name: 'Ashar', time: timings.Asr },
                { name: 'Maghrib', time: timings.Maghrib },
                { name: 'Isya', time: timings.Isha }
            ];

            const html = prayers.map(p => `

        async function fetchAllData() {

                dateDisplay.innerText = new Date().toLocaleDateString('id-ID', options);
            }

            fetchDataGeneric('karyawan', (data) => { 
                dataKaryawan = data; 
                if (currentPage === 'beranda' || currentPage === 'direktur') renderPage(currentPage); 
            });
            fetchDataGeneric('info', (data) => { 
                dataInfo = data; 
                if (currentPage === 'informasi' || currentPage === 'beranda') renderPage(currentPage); 
            });
            fetchDataGeneric('ebook', (data) => { 
                dataEbooks = data.map((item, index) => ({ ...item, color: ebookColors[index % ebookColors.length] })); 
                if (currentPage === 'ebook' || currentPage === 'beranda') renderPage(currentPage); 
            });
            fetchDataGeneric('agenda', (data) => {
                dataAgenda = data;
                if (currentPage === 'beranda') renderPage('beranda');
            });
        }

        async function fetchDataGeneric(type, onSuccess) {
            loadingState[type] = true;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 sec timeout
                const response = await fetch(`${API_URL}?type=${type}&t=${new Date().getTime()}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error("Network error");
                const data = await response.json();
                if (type === 'info' && data.length > 0 && (data[0].nip || data[0].nama_lengkap)) { throw new Error("Data Integrity Mismatch"); }
                if (Array.isArray(data)) onSuccess(data);
            } catch (e) { 
                console.warn(`Gagal memuat ${type}, menggunakan Data Mock.`, e);
                if (!isOfflineMode) { isOfflineMode = true; showToast("Mode Demo: Menggunakan data contoh", "bg-orange-600"); }
                onSuccess(getMockData(type));
            } finally {
                loadingState[type] = false;
                if (type === 'karyawan' && currentPage === 'direktur') renderPage('direktur');
                if (type === 'info' && currentPage === 'informasi') renderPage('informasi');
                if (type === 'ebook' && currentPage === 'ebook') renderPage('ebook');
                if (type === 'agenda' && currentPage === 'beranda') renderPage('beranda');
            }
        }

            const container = document.getElementById('toast-container');

            const toast = document.createElement('div');
            toast.className = `${colorClass} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 mb-2 fade-in`;
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
        }

        function generateCalendarHTML() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay(); 
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const today = now.getDate();
            
            // Map agendas to dates using the parser
            const agendaDates = dataAgenda.map(item => { 
                const d = parseDate(getProp(item, ['date', 'tanggal'])); 
                if (d && !isNaN(d.getTime()) && d.getMonth() === month && d.getFullYear() === year) return d.getDate(); 
                return null; 
            }).filter(Boolean);
            
            let html = `<div class="text-center mb-4 text-sm font-bold text-slate-600 bg-slate-50 py-2 rounded-lg flex justify-between items-center px-4">
                <button class="text-slate-400 hover:text-slate-600"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <span>${monthNames[month]} ${year}</span>
                <button class="text-slate-400 hover:text-slate-600"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wide">
                <div class="text-red-400">Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div class="text-emerald-500">Jum</div><div>Sab</div>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs">`;
            
            for (let i = 0; i < firstDay; i++) html += `<div></div>`;
            
            for (let day = 1; day <= daysInMonth; day++) { 
                let classes = "calendar-day hover:bg-blue-50 transition cursor-default font-medium text-slate-600"; 
                let dot = "";
                
                if (day === today) classes += " calendar-today"; 
                if (agendaDates.includes(day)) {
                    dot = `<div class="calendar-event-dot bg-indigo-500"></div>`;
                    if (day === today) dot = `<div class="calendar-event-dot bg-white"></div>`;
                }
                
                html += `<div class="${classes}">${day} ${dot}</div>`; 
            }
            html += `</div>`;
            return html;
        }

        function initDashboardCharts() {
            // FIX: Added safer checks to prevent crashing on empty data
            if (dataKaryawan.length === 0 || !document.getElementById('genderChart')) return;
            const textColor = isDarkMode ? '#cbd5e1' : '#64748b'; 
            const totalIkhwan = dataKaryawan.filter(d => normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'ikhwan').length;
            const totalAkhwat = dataKaryawan.filter(d => normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'akhwat').length;
            const divisions = [...new Set(dataKaryawan.map(d => getProp(d, ['divisi', 'division']) ? String(getProp(d, ['divisi', 'division'])).trim() : null).filter(Boolean))].sort();
            const malePerDiv = divisions.map(div => dataKaryawan.filter(d => { const dDiv = getProp(d, ['divisi', 'division']); return dDiv && String(dDiv).trim() === div && normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'ikhwan'; }).length);
            const femalePerDiv = divisions.map(div => dataKaryawan.filter(d => { const dDiv = getProp(d, ['divisi', 'division']); return dDiv && String(dDiv).trim() === div && normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'akhwat'; }).length);
            const departments = [...new Set(dataKaryawan.map(d => getProp(d, ['departemen', 'department'])).filter(Boolean))].sort();
            const normalizeEdu = (edu) => { if (!edu) return 'Lainnya'; edu = String(edu).toUpperCase().trim(); if (['S3', 'S2', 'DOKTOR', 'MASTER', 'PASCA'].some(k => edu.includes(k))) return 'Pascasarjana'; if (['S1', 'D4', 'SARJANA', 'BACHELOR'].some(k => edu.includes(k) || edu === 'S1')) return 'Sarjana'; if (['D3', 'D2', 'D1', 'DIPLOMA'].some(k => edu.includes(k))) return 'Diploma'; if (['SMA', 'SMK', 'MA'].some(k => edu.includes(k))) return 'SMA/K'; if (['SMP', 'SD'].some(k => edu.includes(k))) return 'Dasar'; return 'Lainnya'; };
            const eduGroups = ['Pascasarjana', 'Sarjana', 'Diploma', 'SMA/K', 'Dasar', 'Lainnya'];
            const eduColors = { 'Pascasarjana': '#1e3a8a', 'Sarjana': '#2563eb', 'Diploma': '#60a5fa', 'SMA/K': '#94a3b8', 'Dasar': '#cbd5e1', 'Lainnya': '#e2e8f0' };
            const eduDatasets = eduGroups.map((group) => { return { label: group, data: departments.map(dept => dataKaryawan.filter(d => { const empDept = getProp(d, ['departemen', 'department']); const empEdu = getProp(d, ['pendidikan_terakhir', 'education']); return empDept === dept && normalizeEdu(empEdu) === group; }).length), backgroundColor: eduColors[group], barPercentage: 0.6, categoryPercentage: 0.8 }; });

            if (genderChartInstance) genderChartInstance.destroy();
            if (divisionChartInstance) divisionChartInstance.destroy();
            if (eduChartInstance) eduChartInstance.destroy();

            const commonOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 }, color: textColor } } }, scales: { x: { ticks: { color: textColor }, grid: { color: isDarkMode ? '#334155' : '#f1f5f9' } }, y: { ticks: { color: textColor }, grid: { color: isDarkMode ? '#334155' : '#f1f5f9' } } } };
            const ctxGender = document.getElementById('genderChart').getContext('2d');
            genderChartInstance = new Chart(ctxGender, { type: 'doughnut', data: { labels: ['Ikhwan', 'Akhwat'], datasets: [{ data: [totalIkhwan, totalAkhwat], backgroundColor: ['#10b981', '#ec4899'], borderWidth: 0, hoverOffset: 4 }] }, options: { ...commonOptions, scales: {} } });
            const ctxDiv = document.getElementById('divisionChart').getContext('2d');
            const divChartContainer = document.getElementById('divisionChart').parentNode;
            if (divisions.length > 0) { const newHeight = Math.max(300, (divisions.length * 25 + 50)); divChartContainer.style.height = newHeight + 'px'; }
            divisionChartInstance = new Chart(ctxDiv, { type: 'bar', data: { labels: divisions, datasets: [ { label: 'Ikhwan', data: malePerDiv, backgroundColor: '#10b981', stack: 'Stack 0' }, { label: 'Akhwat', data: femalePerDiv, backgroundColor: '#ec4899', stack: 'Stack 0' } ] }, options: { ...commonOptions, indexAxis: 'y', scales: { x: { stacked: true, ticks: {color: textColor} }, y: { stacked: true, ticks: {color: textColor} } } } });
            const ctxEdu = document.getElementById('eduChart').getContext('2d');
            eduChartInstance = new Chart(ctxEdu, { type: 'bar', data: { labels: departments, datasets: eduDatasets }, options: { ...commonOptions, indexAxis: 'y', scales: { x: { stacked: true, ticks: {color: textColor} }, y: { stacked: true, ticks: {color: textColor} } } } });
        }

        function updateEmployeeGrid() {
            const container = document.getElementById('employee-list-container');

            const isMatch = (dataGender, tabGender) => normalizeGender(dataGender) === tabGender;
            let filtered = dataKaryawan.filter(d => isMatch(getProp(d, ['jenis_kelamin', 'gender']), currentDirectorTab));
            if (filterDept) filtered = filtered.filter(d => getProp(d, ['departemen', 'department']) === filterDept);
            if (filterDiv) filtered = filtered.filter(d => getProp(d, ['divisi', 'division']) === filterDiv);
            if (searchKeyword) {
                const lowerKey = searchKeyword.toLowerCase();
                filtered = filtered.filter(d => (getProp(d, ['nama_lengkap', 'name']) || '').toLowerCase().includes(lowerKey) || (String(getProp(d, ['nip'])) || '').toLowerCase().includes(lowerKey));
            }
            filtered.sort((a, b) => {
                const nameA = (getProp(a, ['nama_lengkap', 'name']) || '').toLowerCase();
                const nameB = (getProp(b, ['nama_lengkap', 'name']) || '').toLowerCase();
                if (sortOrder === 'name_desc') return nameB.localeCompare(nameA);
                if (sortOrder === 'date_new') return new Date(getProp(b, ['tanggal_bergabung'])) - new Date(getProp(a, ['tanggal_bergabung']));

                <div class="text-center mb-6 pt-2"><span class="bg-blue-100 text-blue-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">${type}</span><h2 class="text-2xl font-bold text-slate-800 mt-4 leading-snug">${title}</h2><p class="text-sm text-slate-400 mt-2 flex items-center justify-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> ${formatDateIndo(date)}</p></div>
                <div class="prose prose-sm max-w-none text-slate-600 leading-relaxed text-justify"><p class="font-medium mb-4">${summary}</p><hr class="my-4 border-slate-100"><div class="mt-4">${detailHtml}</div></div>
                <div class="mt-8 text-center"><button onclick="closeModal()" class="px-6 py-2 bg-slate-100 text-slate-600 rounded-full hover:bg-slate-200 transition text-sm font-medium">Tutup</button></div>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function openEbookDetail(id) {
            const book = dataEbooks.find(e => getProp(e, 'id') == id);
            if (!book) return;
            const modal = document.getElementById('global-modal');
            const modalContent = document.getElementById('modal-content');
            // ... (Variable extraction same as before)
            const title = getProp(book, ['title', 'judul', 'judul_buku']);
            const author = getProp(book, ['author', 'penulis', 'pengarang']);
            const pages = getProp(book, ['pages', 'halaman', 'jml_halaman', 'jumlah_halaman']);
            const desc = getProp(book, ['deskripsi', 'sinopsis', 'ringkasan']) || 'Tidak ada deskripsi.';
            const link = getProp(book, ['link_download', 'link', 'url']);
            const descHtml = desc.replace(/\n/g, '<br>');
            const downloadBtn = link ? `<a href="${link}" target="_blank" class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 transition flex items-center justify-center gap-2 font-medium shadow-lg shadow-blue-200"><i data-lucide="download" class="w-5 h-5"></i> Download PDF</a>` : `<button disabled class="w-full bg-slate-300 text-slate-500 py-3 rounded-xl flex items-center justify-center gap-2 font-medium cursor-not-allowed">Link Tidak Tersedia</button>`;
            modalContent.innerHTML = `<button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-50"><i data-lucide="x" class="w-6 h-6"></i></button><div class="flex flex-col items-center mb-6"><div class="w-24 h-32 ${book.color} rounded-lg flex items-center justify-center shadow-lg mb-4 transform hover:scale-105 transition-transform duration-300"><i data-lucide="book" class="w-10 h-10 opacity-80"></i></div><h2 class="text-xl font-bold text-slate-800 text-center">${title}</h2><p class="text-sm text-blue-600 font-medium mt-1">${author}</p><span class="text-xs text-slate-400 mt-2 bg-slate-50 px-2 py-1 rounded">${pages} Halaman</span></div><div class="bg-slate-50 p-4 rounded-xl mb-6"><h4 class="font-bold text-slate-700 text-sm mb-2">Sinopsis</h4><p class="text-sm text-slate-600 leading-relaxed">${descHtml}</p></div>${downloadBtn}`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        window.switchModalTab = function(tab) {
            const infoContent = document.getElementById('content-info');
            const idCardContent = document.getElementById('content-idcard');
            const tabInfo = document.getElementById('tab-info');
            const tabIdCard = document.getElementById('tab-idcard');
            if (tab === 'info') {
                infoContent.classList.remove('hidden');
                idCardContent.classList.add('hidden');
                tabInfo.className = "pb-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
                tabIdCard.className = "pb-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600";
            } else {
                infoContent.classList.add('hidden');
                idCardContent.classList.remove('hidden');
                tabInfo.className = "pb-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600";
                tabIdCard.className = "pb-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
            }
        }

        function closeModal() { document.getElementById('global-modal').classList.add('hidden'); }
