    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        .sidebar-link {
            display: flex; align-items: center; gap: 0.75rem; 
            padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.9rem; font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent; margin-bottom: 0.25rem;
        }
        .sidebar-active { background-color: #eff6ff; color: #2563eb; border-color: #dbeafe; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .sidebar-inactive { color: #64748b; }
        .sidebar-inactive:hover { background-color: #f8fafc; color: #1e293b; border-color: #e2e8f0; }

        .active-tab-nav { color: #2563eb; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .id-card-bg { background-image: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); position: relative; overflow: hidden; }
        .id-card-pattern { position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; }

        /* Calendar Styles */
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; font-size: 0.75rem; position: relative; }
        .calendar-event::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background-color: #2563eb; border-radius: 50%; }
        .calendar-today { background-color: #2563eb; color: white; font-weight: bold; }
        .calendar-today::after { background-color: white; }

<body class="text-slate-800 flex flex-col md:flex-row min-h-screen">

            <button onclick="renderPage('ebook')" id="sidebar-ebook" class="sidebar-link sidebar-inactive w-full"><i data-lucide="book-open" class="w-5 h-5"></i><span class="flex-1 text-left">Ebook Panduan</span></button>
            <button onclick="renderPage('hrd')" id="sidebar-hrd" class="sidebar-link sidebar-inactive w-full"><i data-lucide="headset" class="w-5 h-5"></i><span class="flex-1 text-left">Layanan HRD</span></button>
            <button onclick="renderPage('generator')" id="sidebar-generator" class="sidebar-link sidebar-inactive w-full"><i data-lucide="wand-2" class="w-5 h-5"></i><span class="flex-1 text-left">Tools & Kalkulator</span></button>
        </nav>
        <div class="p-4 border-t border-slate-100 bg-white z-10">

    <!-- CONTENT -->
    <div class="flex-1 flex flex-col min-w-0 bg-slate-50/50 relative">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200 md:border-none md:bg-transparent md:static">
            <div class="max-w-7xl mx-auto px-4 py-3 md:py-6 flex justify-between items-center">
                <div class="md:hidden"><h1 class="text-lg font-bold text-blue-900 flex items-center gap-2"><i data-lucide="layout-grid" class="w-5 h-5 text-blue-600"></i> HRD Info</h1></div>
                <div class="hidden md:block"><h2 class="text-xl font-bold text-slate-800 tracking-tight">Ahlan Wasahlan Karyawan FIWA</h2></div>
                <div class="flex items-center gap-3">
                    <button id="installPWA" class="hidden text-xs bg-blue-600 text-white px-4 py-2 rounded-full font-medium shadow-md shadow-blue-200 hover:bg-blue-700 transition flex items-center gap-2"><i data-lucide="download" class="w-3 h-3"></i> Install App</button>
                    <button class="p-2 rounded-full hover:bg-white hover:shadow-sm transition text-slate-600 relative"><i data-lucide="bell" class="w-5 h-5"></i><span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 border border-white rounded-full"></span></button>

        <main id="app-content" class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full pb-24 md:pb-8"></main>

        <div id="global-modal" class="fixed inset-0 z-[60] hidden">

    <!-- MOBILE NAV -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="grid grid-cols-6 h-[4.5rem]">
            <button onclick="renderPage('beranda')" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 active-tab-nav" id="nav-beranda"><i data-lucide="home" class="w-6 h-6 stroke-[1.5]"></i><span class="text-[9px] font-medium tracking-wide">Home</span></button>
            <button onclick="renderPage('informasi')" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 inactive-tab-nav" id="nav-informasi"><i data-lucide="info" class="w-6 h-6 stroke-[1.5]"></i><span class="text-[9px] font-medium tracking-wide">Info</span></button>
            <button onclick="renderPage('direktur')" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 inactive-tab-nav" id="nav-direktur"><i data-lucide="users" class="w-5 h-5 stroke-[1.5]"></i><span class="text-[9px] font-medium tracking-wide">Karyawan</span></button>
            <button onclick="renderPage('ebook')" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 inactive-tab-nav" id="nav-ebook"><i data-lucide="book-open" class="w-5 h-5 stroke-[1.5]"></i><span class="text-[9px] font-medium tracking-wide">Ebook</span></button>
            <button onclick="renderPage('hrd')" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 inactive-tab-nav" id="nav-hrd"><i data-lucide="headset" class="w-6 h-6 stroke-[1.5]"></i><span class="text-[9px] font-medium tracking-wide">HRD</span></button>
            <button onclick="renderPage('generator')" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 inactive-tab-nav" id="nav-generator"><i data-lucide="wand-2" class="w-6 h-6 stroke-[1.5]"></i><span class="text-[9px] font-medium tracking-wide">Tools</span></button>

        <div class="h-1 w-full bg-white"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyewRCKBX375YrWDPvoRkIOcHD8UENTO57Dbjl7a5mCzSQvXNhcydvY-1tCJCewrHlymg/exec";
        
        let dataKaryawan = [], dataInfo = [], dataEbooks = [];
        let loadingState = { karyawan: false, info: false, ebook: false };
        const ebookColors = ["bg-emerald-100 text-emerald-600", "bg-blue-100 text-blue-600", "bg-purple-100 text-purple-600", "bg-orange-100 text-orange-600", "bg-pink-100 text-pink-600", "bg-indigo-100 text-indigo-600"];

        let currentPage = 'beranda';
        let currentDirectorTab = 'ikhwan';
        let searchKeyword = '', sortOrder = 'name_asc', filterDept = '', filterDiv = '';
        let genderChartInstance = null, divisionChartInstance = null, eduChartInstance = null;

        // --- HELPER SMART MAPPING ---
        function getProp(obj, keys) {
            if (!obj) return null;
            if (!Array.isArray(keys)) keys = [keys];
            for (let key of keys) {
                if (obj[key] !== undefined) return obj[key];
                let lowerKey = key.toLowerCase();
                for (let k in obj) {
                    let kNorm = k.toLowerCase().replace(/_/g, '').replace(/\s/g, '');
                    let keyNorm = lowerKey.replace(/_/g, '').replace(/\s/g, '');
                    if (kNorm === keyNorm) return obj[k];
                }
            }
            return null;
        }

        // --- UTILS ---
        function formatDateIndo(dateString) {
            if (!dateString) return "-";
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString; 
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }
        function hitungMasaKerja(dateString) {
            if (!dateString) return "";
            let startDate = new Date(dateString);
            if (isNaN(startDate.getTime())) return "";
            const now = new Date();
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }
            let result = [];
            if (years > 0) result.push(`${years} Thn`);
            if (months > 0) result.push(`${months} Bln`);
            return result.length === 0 ? "Baru Bergabung" : result.join(" ");
        }
        function normalizeGender(g) {
            if (!g) return 'unknown';
            g = String(g).toLowerCase().trim();
            if (['ikhwan', 'laki-laki', 'laki', 'l', 'pria', 'male', 'putra'].includes(g)) return 'ikhwan';
            if (['akhwat', 'perempuan', 'wanita', 'p', 'female', 'putri'].includes(g)) return 'akhwat';
            return 'unknown';
        }
        function getDirectDriveUrl(url) {
            if (!url) return 'https://api.dicebear.com/7.x/avataaars/svg?seed=fallback';
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                const idRegex = /[-\w]{25,}/;
                const match = url.match(idRegex);
                if (match) return `https://lh3.googleusercontent.com/d/${match[0]}`;
            }
            return url;
        }

        // --- FETCH DATA ---
        async function fetchAllData() {
            if (!API_URL) return;
            fetchDataGeneric('karyawan', (data) => { dataKaryawan = data; if (currentPage === 'beranda' || currentPage === 'direktur') renderPage(currentPage); });
            fetchDataGeneric('info', (data) => { dataInfo = data; if (currentPage === 'informasi' || currentPage === 'beranda') renderPage(currentPage); });
            fetchDataGeneric('ebook', (data) => { dataEbooks = data.map((item, index) => ({ ...item, color: ebookColors[index % ebookColors.length] })); if (currentPage === 'ebook' || currentPage === 'beranda') renderPage(currentPage); });
        }
        async function fetchDataGeneric(type, onSuccess) {
            loadingState[type] = true;
            try {
                const response = await fetch(`${API_URL}?type=${type}&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Network error");
                const data = await response.json();
                if (type === 'info' && data.length > 0 && (data[0].nip || data[0].nama_lengkap)) { console.warn(`Warning: Data ${type} salah.`); return; }
                if (Array.isArray(data)) onSuccess(data);
            } catch (e) { console.error(`Gagal memuat ${type}:`, e); } finally {
                loadingState[type] = false;
                if (type === 'karyawan' && currentPage === 'direktur') renderPage('direktur');
                if (type === 'info' && currentPage === 'informasi') renderPage('informasi');
                if (type === 'ebook' && currentPage === 'ebook') renderPage('ebook');
            }
        }
        function showToast(message, colorClass = "bg-slate-800") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `${colorClass} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 mb-2 fade-in`;
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
        }

        // --- RENDER ENGINE ---
        function renderPage(pageName) {
            currentPage = pageName;
            updateNavStyles();
            const content = document.getElementById('app-content');
            content.innerHTML = '';
            switch(pageName) {
                case 'beranda': content.innerHTML = getBerandaHTML(); setTimeout(initDashboardCharts, 100); break;
                case 'informasi': content.innerHTML = getInformasiHTML(); break;
                case 'direktur': content.innerHTML = getDirekturHTML(); if (loadingState.karyawan) { document.getElementById('employee-list-container').innerHTML = '<div class="flex flex-col justify-center items-center h-64 text-slate-400"><div class="loader mb-3"></div><p>Memuat Data...</p></div>'; } else { updateEmployeeGrid(); } break;
                case 'ebook': content.innerHTML = getEbookHTML(); break;
                case 'hrd': content.innerHTML = getKontakHRDHTML(); break;
                case 'generator': content.innerHTML = getGeneratorHTML(); break;
            }
            lucide.createIcons();
            window.scrollTo(0, 0);
        }
        function updateNavStyles() {
            document.querySelectorAll('.nav-btn').forEach(btn => { const isActive = btn.id === `nav-${currentPage}`; btn.className = `nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 ${isActive ? 'active-tab-nav' : 'inactive-tab-nav'}`; });
            document.querySelectorAll('.sidebar-link').forEach(link => { const isActive = link.id === `sidebar-${currentPage}`; link.className = 'sidebar-link w-full ' + (isActive ? 'sidebar-active' : 'sidebar-inactive'); });
        }

        // --- DASHBOARD ---
        function getBerandaHTML() {
            const totalKaryawan = dataKaryawan.length;
            const uniqueDivisi = new Set(dataKaryawan.map(d => getProp(d, 'divisi')).filter(Boolean)).size;
            const totalIkhwan = dataKaryawan.filter(d => normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'ikhwan').length;
            const totalAkhwat = dataKaryawan.filter(d => normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'akhwat').length;
            const now = new Date();
            const newJoiners = dataKaryawan.filter(d => { const dateVal = getProp(d, ['tanggal_bergabung', 'join_date']); if(!dateVal) return false; const joinDate = new Date(dateVal); return joinDate.getMonth() === now.getMonth() && joinDate.getFullYear() === now.getFullYear(); });
            const expiringThisMonth = dataKaryawan.filter(d => { const dateVal = getProp(d, ['tanggal_akhir_kontrak', 'akhir_kontrak']); if(!dateVal) return false; const expDate = new Date(dateVal); return expDate.getMonth() === now.getMonth() && expDate.getFullYear() === now.getFullYear(); });
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const expiringNextMonth = dataKaryawan.filter(d => { const dateVal = getProp(d, ['tanggal_akhir_kontrak', 'akhir_kontrak']); if(!dateVal) return false; const expDate = new Date(dateVal); return expDate.getMonth() === nextMonth.getMonth() && expDate.getFullYear() === nextMonth.getFullYear(); });
            const recentInfo = dataInfo.slice(0, 3);
            const calendarHTML = generateCalendarHTML();

            return `<div class="space-y-6"><div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden"><div class="relative z-10"><h2 class="text-2xl font-bold mb-1">Dashboard Karyawan</h2><p class="text-blue-100 text-sm">Ringkasan data statistik kepegawaian periode ini.</p></div><div class="absolute right-0 top-0 h-full w-1/3 bg-white/10 skew-x-12 -mr-10"></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center"><div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2"><i data-lucide="users" class="w-5 h-5"></i></div><h3 class="text-2xl font-bold text-slate-800">${totalKaryawan}</h3><p class="text-xs text-slate-500">Total Karyawan</p></div><div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center"><div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-2"><i data-lucide="building-2" class="w-5 h-5"></i></div><h3 class="text-2xl font-bold text-slate-800">${uniqueDivisi}</h3><p class="text-xs text-slate-500">Total Divisi</p></div><div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center"><div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i data-lucide="user" class="w-5 h-5"></i></div><h3 class="text-2xl font-bold text-slate-800">${totalIkhwan}</h3><p class="text-xs text-slate-500">Ikhwan (L)</p></div><div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center"><div class="w-10 h-10 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mb-2"><i data-lucide="user" class="w-5 h-5"></i></div><h3 class="text-2xl font-bold text-slate-800">${totalAkhwat}</h3><p class="text-xs text-slate-500">Akhwat (P)</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-6"><div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><h3 class="font-bold text-slate-700 mb-4 text-sm flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4 text-blue-500"></i> Komposisi Gender</h3><div class="relative h-64 flex justify-center"><canvas id="genderChart"></canvas></div></div><div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><h3 class="font-bold text-slate-700 mb-4 text-sm flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 text-purple-500"></i> Gender per Divisi</h3><div class="relative h-64 w-full"><canvas id="divisionChart"></canvas></div></div></div><div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><h3 class="font-bold text-slate-700 mb-4 text-sm flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-indigo-500"></i> Pendidikan per Departemen</h3><div class="relative h-80 w-full"><canvas id="eduChart"></canvas></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-slate-700 text-sm flex items-center gap-2"><i data-lucide="calendar-x" class="w-4 h-4 text-red-500"></i> Habis Kontrak Bulan Ini</h3><span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-bold">${expiringThisMonth.length}</span></div><div class="space-y-3 max-h-32 overflow-y-auto pr-1 no-scrollbar">${expiringThisMonth.length === 0 ? '<p class="text-xs text-slate-400 italic text-center py-4">Tidak ada karyawan habis kontrak bulan ini.</p>' : expiringThisMonth.map(emp => { const name = getProp(emp, ['nama_lengkap', 'nama']); const div = getProp(emp, ['divisi', 'division']); const end = getProp(emp, ['tanggal_akhir_kontrak', 'akhir_kontrak']); return `<div class="flex items-center justify-between gap-3 p-2 hover:bg-slate-50 rounded-lg transition border border-transparent hover:border-slate-100"><div class="min-w-0"><p class="text-sm font-semibold text-slate-800 truncate">${name}</p><p class="text-[10px] text-slate-500 truncate">${div}</p></div><span class="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-1 rounded">${formatDateIndo(end)}</span></div>` }).join('')}</div></div><div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-slate-700 text-sm flex items-center gap-2"><i data-lucide="calendar-clock" class="w-4 h-4 text-orange-500"></i> Habis Kontrak Bulan Depan</h3><span class="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-full font-bold">${expiringNextMonth.length}</span></div><div class="space-y-3 max-h-32 overflow-y-auto pr-1 no-scrollbar">${expiringNextMonth.length === 0 ? '<p class="text-xs text-slate-400 italic text-center py-4">Tidak ada karyawan habis kontrak bulan depan.</p>' : expiringNextMonth.map(emp => { const name = getProp(emp, ['nama_lengkap', 'nama']); const div = getProp(emp, ['divisi', 'division']); const end = getProp(emp, ['tanggal_akhir_kontrak', 'akhir_kontrak']); return `<div class="flex items-center justify-between gap-3 p-2 hover:bg-slate-50 rounded-lg transition border border-transparent hover:border-slate-100"><div class="min-w-0"><p class="text-sm font-semibold text-slate-800 truncate">${name}</p><p class="text-[10px] text-slate-500 truncate">${div}</p></div><span class="text-[10px] font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded">${formatDateIndo(end)}</span></div>` }).join('')}</div></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-slate-700 text-sm flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4 text-emerald-500"></i> B v></div></div>`;

        function generateCalendarHTML() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay(); 
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const today = now.getDate();
            const eventDates = dataInfo.map(item => { const d = new Date(getProp(item, ['date', 'tanggal'])); if (!isNaN(d.getTime()) && d.getMonth() === month && d.getFullYear() === year) return d.getDate(); return null; }).filter(Boolean);
            let html = `<div class="text-center mb-4 text-sm font-semibold text-slate-600">${monthNames[month]} ${year}</div><div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-400 mb-2"><div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div></div><div class="grid grid-cols-7 gap-1 text-center">`;
            for (let i = 0; i < firstDay; i++) html += `<div></div>`;
            for (let day = 1; day <= daysInMonth; day++) { let classes = "calendar-day hover:bg-blue-50 transition cursor-default"; if (day === today) classes += " calendar-today"; if (eventDates.includes(day)) classes += " calendar-event"; html += `<div class="${classes}">${day}</div>`; }
            html += `</div><div class="mt-4 flex items-center justify-center gap-4 text-[10px] text-slate-400"><div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-blue-600"></div> Hari Ini</div><div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-blue-600 opacity-50"></div> Agenda</div></div>`;
            return html;
        }

        function initDashboardCharts() {
            if (dataKaryawan.length === 0 || !document.getElementById('genderChart')) return;
            const totalIkhwan = dataKaryawan.filter(d => normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'ikhwan').length;
            const totalAkhwat = dataKaryawan.filter(d => normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'akhwat').length;
            const divisions = [...new Set(dataKaryawan.map(d => getProp(d, ['divisi', 'division']) ? String(getProp(d, ['divisi', 'division'])).trim() : null).filter(Boolean))].sort();
            const malePerDiv = divisions.map(div => dataKaryawan.filter(d => { const dDiv = getProp(d, ['divisi', 'division']); return dDiv && String(dDiv).trim() === div && normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'ikhwan'; }).length);
            const femalePerDiv = divisions.map(div => dataKaryawan.filter(d => { const dDiv = getProp(d, ['divisi', 'division']); return dDiv && String(dDiv).trim() === div && normalizeGender(getProp(d, ['jenis_kelamin', 'gender'])) === 'akhwat'; }).length);
            const departments = [...new Set(dataKaryawan.map(d => getProp(d, ['departemen', 'department'])).filter(Boolean))].sort();
            const normalizeEdu = (edu) => { if (!edu) return 'Lainnya'; edu = String(edu).toUpperCase().trim(); if (['S3', 'S2', 'DOKTOR', 'MASTER', 'PASCA'].some(k => edu.includes(k))) return 'Pascasarjana'; if (['S1', 'D4', 'SARJANA', 'BACHELOR'].some(k => edu.includes(k) || edu === 'S1')) return 'Sarjana'; if (['D3', 'D2', 'D1', 'DIPLOMA'].some(k => edu.includes(k))) return 'Diploma'; if (['SMA', 'SMK', 'MA'].some(k => edu.includes(k))) return 'SMA/K'; if (['SMP', 'SD'].some(k => edu.includes(k))) return 'Dasar'; return 'Lainnya'; };
            const eduGroups = ['Pascasarjana', 'Sarjana', 'Diploma', 'SMA/K', 'Dasar', 'Lainnya'];
            const eduColors = { 'Pascasarjana': '#1e3a8a', 'Sarjana': '#2563eb', 'Diploma': '#60a5fa', 'SMA/K': '#94a3b8', 'Dasar': '#cbd5e1', 'Lainnya': '#e2e8f0' };
            const eduDatasets = eduGroups.map((group) => { return { label: group, data: departments.map(dept => dataKaryawan.filter(d => { const empDept = getProp(d, ['departemen', 'department']); const empEdu = getProp(d, ['pendidikan_terakhir', 'education']); return empDept === dept && normalizeEdu(empEdu) === group; }).length), backgroundColor: eduColors[group], barPercentage: 0.6, categoryPercentage: 0.8 }; });

            if (genderChartInstance) genderChartInstance.destroy();
            if (divisionChartInstance) divisionChartInstance.destroy();
            if (eduChartInstance) eduChartInstance.destroy();

            const ctxGender = document.getElementById('genderChart').getContext('2d');
            genderChartInstance = new Chart(ctxGender, { type: 'doughnut', data: { labels: ['Ikhwan', 'Akhwat'], datasets: [{ data: [totalIkhwan, totalAkhwat], backgroundColor: ['#10b981', '#ec4899'], borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } } });
            const ctxDiv = document.getElementById('divisionChart').getContext('2d');
            const divChartContainer = document.getElementById('divisionChart').parentNode;
            if (divisions.length > 0) { const newHeight = Math.max(300, (divisions.length * 25 + 50)); divChartContainer.style.height = newHeight + 'px'; }
            divisionChartInstance = new Chart(ctxDiv, { type: 'bar', data: { labels: divisions, datasets: [ { label: 'Ikhwan', data: malePerDiv, backgroundColor: '#10b981', stack: 'Stack 0' }, { label: 'Akhwat', data: femalePerDiv, backgroundColor: '#ec4899', stack: 'Stack 0' } ] }, options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', scales: { x: { stacked: true }, y: { stacked: true, ticks: { font: { size: 10 }, autoSkip: false } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } } });
            const ctxEdu = document.getElementById('eduChart').getContext('2d');
            eduChartInstance = new Chart(ctxEdu, { type: 'bar', data: { labels: departments, datasets: eduDatasets }, options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', scales: { x: { stacked: true, beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } }, grid: { color: '#f1f5f9' } }, y: { stacked: true, ticks: { font: { size: 10, weight: '500' } }, grid: { display: false } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 }, usePointStyle: true } }, tooltip: { callbacks: { footer: (tooltipItems) => { let sum = 0; tooltipItems.forEach(function(tooltipItem) { sum += tooltipItem.parsed.x; }); return 'Total: ' + sum + ' Org'; } } } } } });
        }

        function getDirekturHTML() {
            const depts = [...new Set(dataKaryawan.map(d => getProp(d, ['departemen', 'department'])).filter(Boolean))].sort();

 'selected' : ''}>Baru</option></select><i data-lucide="arrow-up-down" class="absolute right-2 top-2.5 w-4 h-4 text-slate-400 pointer-events-none"></i></div><div class="relative w-auto min-w-[100px] max-w-[150px]"><select onchange="handleFilter('dept', this.value)" class="w-full pl-3 pr-8 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-600 shadow-sm appearance-none truncate"><option value="">Dept: Semua</option>${deptOptions}</select><i data-lucide="chevron-down" class="absolute right-2 top-2.5 w-4 h-4 text-slate-400 pointer-events-none"></i></div><div class="relative w-auto min-w-[100px] max-w-[150px]"><select onchange="handleFilter('div', this.value)" class="w-full pl-3 pr-8 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-600 shadow-sm appearance-none truncate"><option value="">Div: Semua</option>${divOptions}</select><i data-lucide="chevron-down" class="absolute right-2 top-2.5 w-4 h-4 text-slate-400 pointer-events-none"></i></div></div></div><div id="employee-list-container" class="fade-in min-h-[300px]"></div></div>`;

        function updateEmployeeGrid() {
            const container = document.getElementById('employee-list-container');
            if (!container) return;
            const isMatch = (dataGender, tabGender) => normalizeGender(dataGender) === tabGender;
            let filtered = dataKaryawan.filter(d => isMatch(getProp(d, ['jenis_kelamin', 'gender']), currentDirectorTab));
            if (filterDept) filtered = filtered.filter(d => getProp(d, ['departemen', 'department']) === filterDept);
            if (filterDiv) filtered = filtered.filter(d => getProp(d, ['divisi', 'division']) === filterDiv);
            if (searchKeyword) {
                const lowerKey = searchKeyword.toLowerCase();
                filtered = filtered.filter(d => (getProp(d, ['nama_lengkap', 'name']) || '').toLowerCase().includes(lowerKey) || (String(getProp(d, ['nip'])) || '').toLowerCase().includes(lowerKey) || (getProp(d, ['jabatan', 'position']) || '').toLowerCase().includes(lowerKey));
            }
            filtered.sort((a, b) => {
                const nameA = (getProp(a, ['nama_lengkap', 'name']) || '').toLowerCase();
                const nameB = (getProp(b, ['nama_lengkap', 'name']) || '').toLowerCase();
                const dateA = new Date(getProp(a, ['tanggal_bergabung', 'join_date']) || 0);
                const dateB = new Date(getProp(b, ['tanggal_bergabung', 'join_date']) || 0);
                if (sortOrder === 'name_desc') return nameB.localeCompare(nameA);
                if (sortOrder === 'date_new') return dateB - dateA;
                return nameA.localeCompare(nameB);
            });

        function calculateFinance() {
            const gaji = parseFloat(document.getElementById('calc-gaji').value) || 0;
            const status = document.getElementById('calc-status').value;
            const zakat = gaji * 0.025;
            let taxRate = 0;
            if (gaji <= 5400000) taxRate = 0; else if (gaji <= 5650000) taxRate = 0.0025; else if (gaji <= 5950000) taxRate = 0.005; else if (gaji <= 6300000) taxRate = 0.0075; else if (gaji <= 6750000) taxRate = 0.01; else if (gaji <= 7500000) taxRate = 0.015; else if (gaji <= 8550000) taxRate = 0.02; else if (gaji <= 9650000) taxRate = 0.025; else if (gaji <= 11050000) taxRate = 0.03; else taxRate = 0.05; 
            const tax = gaji * taxRate;
            document.getElementById('res-zakat').textContent = "Rp " + zakat.toLocaleString('id-ID');
            document.getElementById('res-tax').textContent = "Rp " + tax.toLocaleString('id-ID');
            document.getElementById('calc-result').classList.remove('hidden');
        }

        function runGenerator() {
            const input = document.getElementById('genInput').value;

            const output = input.replace(/\n/g, '<br>');
            document.getElementById('genOutput').value = output;

        function copyGenResult() {
            const copyText = document.getElementById("genOutput");
            if(!copyText.value) return;
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value).then(() => { showToast("Teks berhasil disalin!", "bg-emerald-600"); });
        }
        function formatText(cmd) {
            const input = document.getElementById('genInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            const selected = text.substring(start, end);
            if (!selected) return;
            let formatted = '';
            switch(cmd) {
                case 'b': formatted = `<b>${selected}</b>`; break;
                case 'i': formatted = `<i>${selected}</i>`; break;
                case 'u': formatted = `<u>${selected}</u>`; break;
                case 'left': formatted = `<div class="text-left">${selected}</div>`; break;
                case 'center': formatted = `<div class="text-center">${selected}</div>`; break;
                case 'right': formatted = `<div class="text-right">${selected}</div>`; break;
                case 'justify': formatted = `<div class="text-justify">${selected}</div>`; break;
            }
            input.value = text.substring(0, start) + formatted + text.substring(end);
        }

                            ${contractEnd ? `<div class="p-3 bg-slate-50 rounded-lg col-span-2 sm:col-span-1"><p class="text-xs text-slate-400 mb-1">Akhir Kontrak</p><p class="font-medium text-red-600">${formatDateIndo(contractEnd)}</p></div>` : ''}
                        </div>
                        <div class="border-t border-slate-100 pt-4"><h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i data-lucide="graduation-cap" class="w-4 h-4 text-blue-500"></i> Pendidikan</h4><div class="flex justify-between text-sm"><span class="text-slate-500">Pendidikan Terakhir</span><span class="font-medium text-slate-700 text-right">${edu} - ${eduName}</span></div></div>
                        <div class="border-t border-slate-100 pt-4"><h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i> Data BPJS</h4><div class="space-y-2 text-sm"><div class="flex justify-between"><span class="text-slate-500">BPJS Kesehatan</span><span class="font-mono text-slate-700">${bpjsKes}</span></div><div class="flex justify-between"><span class="text-slate-500">BPJS Ketenagakerjaan</span><span class="font-mono text-slate-700">${bpjsKet}</span></div></div></div>
                    </div>
                </div>
                <div id="content-idcard" class="hidden">${generateIDCard(emp)}</div>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function openInfoDetail(id) {
            const item = dataInfo.find(i => getProp(i, 'id') == id);
            if (!item) return;
            const modal = document.getElementById('global-modal');
            const modalContent = document.getElementById('modal-content');
            
            const type = getProp(item, ['type', 'jenis', 'kategori']);
            const title = getProp(item, ['title', 'judul']);
            const date = getProp(item, ['date', 'tanggal']);
            const summary = getProp(item, ['summary', 'ringkasan', 'deskripsi_singkat']);
            const detail = getProp(item, ['detail', 'isi', 'konten']) || 'Tidak ada informasi tambahan.';
            
            // Handle newlines by replacing with <br>
            const detailHtml = detail.replace(/\n/g, '<br>');

            modalContent.innerHTML = `
                <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-50"><i data-lucide="x" class="w-6 h-6"></i></button>
                <div class="text-center mb-6 pt-2"><span class="bg-blue-100 text-blue-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">${type}</span><h2 class="text-2xl font-bold text-slate-800 mt-4 leading-snug">${title}</h2><p class="text-sm text-slate-400 mt-2 flex items-center justify-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> ${formatDateIndo(date)}</p></div>
                <div class="prose prose-sm max-w-none text-slate-600 leading-relaxed text-justify"><p class="font-medium mb-4">${summary}</p><hr class="my-4 border-slate-100"><div class="mt-4">${detailHtml}</div></div>
                <div class="mt-8 text-center"><button onclick="closeModal()" class="px-6 py-2 bg-slate-100 text-slate-600 rounded-full hover:bg-slate-200 transition text-sm font-medium">Tutup</button></div>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function openEbookDetail(id) {
            const book = dataEbooks.find(e => getProp(e, 'id') == id);
            if (!book) return;
            const modal = document.getElementById('global-modal');
            const modalContent = document.getElementById('modal-content');
            
            const title = getProp(book, ['title', 'judul', 'judul_buku']);
            const author = getProp(book, ['author', 'penulis', 'pengarang']);
            const pages = getProp(book, ['pages', 'halaman', 'jml_halaman', 'jumlah_halaman']);
            const desc = getProp(book, ['deskripsi', 'sinopsis', 'ringkasan']) || 'Tidak ada deskripsi.';
            const link = getProp(book, ['link_download', 'link', 'url']);
            
            // Handle newlines by replacing with <br>
            const descHtml = desc.replace(/\n/g, '<br>');

            const downloadBtn = link 
                ? `<a href="${link}" target="_blank" class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 transition flex items-center justify-center gap-2 font-medium shadow-lg shadow-blue-200"><i data-lucide="download" class="w-5 h-5"></i> Download PDF</a>`
                : `<button disabled class="w-full bg-slate-300 text-slate-500 py-3 rounded-xl flex items-center justify-center gap-2 font-medium cursor-not-allowed">Link Tidak Tersedia</button>`;

            modalContent.innerHTML = `
                <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-50"><i data-lucide="x" class="w-6 h-6"></i></button>
                <div class="flex flex-col items-center mb-6"><div class="w-24 h-32 ${book.color} rounded-lg flex items-center justify-center shadow-lg mb-4 transform hover:scale-105 transition-transform duration-300"><i data-lucide="book" class="w-10 h-10 opacity-80"></i></div><h2 class="text-xl font-bold text-slate-800 text-center">${title}</h2><p class="text-sm text-blue-600 font-medium mt-1">${author}</p><span class="text-xs text-slate-400 mt-2 bg-slate-50 px-2 py-1 rounded">${pages} Halaman</span></div>
                <div class="bg-slate-50 p-4 rounded-xl mb-6"><h4 class="font-bold text-slate-700 text-sm mb-2">Sinopsis</h4><p class="text-sm text-slate-600 leading-relaxed">${descHtml}</p></div>
                ${downloadBtn}`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        window.switchModalTab = function(tab) {
            const infoContent = document.getElementById('content-info');
            const idCardContent = document.getElementById('content-idcard');
            const tabInfo = document.getElementById('tab-info');
            const tabIdCard = document.getElementById('tab-idcard');

            if (tab === 'info') {
                infoContent.classList.remove('hidden');
                idCardContent.classList.add('hidden');
                tabInfo.className = "pb-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
                tabIdCard.className = "pb-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600";
            } else {
                infoContent.classList.add('hidden');
                idCardContent.classList.remove('hidden');
                tabInfo.className = "pb-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600";
                tabIdCard.className = "pb-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
            }
        }

        function closeModal() { document.getElementById('global-modal').classList.add('hidden'); }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const installBtn = document.getElementById('installPWA'); if(installBtn) { installBtn.classList.remove('hidden'); installBtn.addEventListener('click', () => { deferredPrompt.prompt(); deferredPrompt.userChoice.then((choiceResult) => { deferredPrompt = null; installBtn.classList.add('hidden'); }); }); } });
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').then((reg) => console.log('Service worker registered.', reg)).catch((err) => console.log('Service worker registration failed.', err)); }); }

        document.addEventListener("DOMContentLoaded", () => {
            fetchAllData();
            renderPage('beranda');
        });
    </script>
</body>
</html>
